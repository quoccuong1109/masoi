<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Blue brand background -->
  <rect width="512" height="512" rx="80" fill="#1a3bbf"/>

  <!-- Subtle radial glow center -->
  <radialGradient id="glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#3a5fd9" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#1a3bbf" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="80" fill="url(#glow)"/>

  <!-- Stylized person silhouette (white, cut-out style) -->
  <!-- Head -->
  <circle cx="256" cy="178" r="72" fill="white"/>
  <!-- Body shoulders -->
  <path d="M 120 420 Q 120 310 256 300 Q 392 310 392 420 Z" fill="white"/>

  <!-- Lightbulb icon top-right (yellow) -->
  <g transform="translate(340,52) scale(0.9)">
    <!-- Bulb shape -->
    <ellipse cx="60" cy="58" rx="38" ry="42" fill="#FFE234"/>
    <rect x="42" y="92" width="36" height="10" rx="4" fill="#FFE234"/>
    <rect x="44" y="104" width="32" height="10" rx="4" fill="#D4B800"/>
    <rect x="46" y="116" width="28" height="8" rx="4" fill="#D4B800"/>
    <!-- Filament lines -->
    <line x1="60" y1="40" x2="60" y2="75" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <line x1="48" y1="52" x2="72" y2="52" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <!-- Rays -->
    <line x1="60" y1="5"  x2="60" y2="18" stroke="#FFE234" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="96" x2="60" y2="96" stroke="none"/>
    <line x1="13" y1="20" x2="22" y2="29" stroke="#FFE234" stroke-width="4" stroke-linecap="round"/>
    <line x1="107" y1="20" x2="98" y2="29" stroke="#FFE234" stroke-width="4" stroke-linecap="round"/>
    <line x1="5"  y1="58" x2="18" y2="58" stroke="#FFE234" stroke-width="4" stroke-linecap="round"/>
    <line x1="115" y1="58" x2="102" y2="58" stroke="#FFE234" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- "MA SÓI" branding at bottom -->
  <text x="256" y="462" text-anchor="middle"
    font-family="-apple-system,system-ui,sans-serif"
    font-size="52" font-weight="900" fill="white" letter-spacing="3" opacity="0.95">MA SÓI</text>
</svg>
